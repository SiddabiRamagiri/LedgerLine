services:
  - type: web
    name: ledgerline
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: DB_POOL_MAX
        value: 5
      - key: DB_IDLE_TIMEOUT_MS
        value: 30000
      - key: DB_CONNECTION_TIMEOUT_MS
        value: 10000

# Do not enable this until production migrations are explicitly approved.
# Enabling a preDeployCommand requires upgrading to an eligible paid service plan:
# preDeployCommand: npm run db:migrate
# Supply MIGRATION_DATABASE_URL only to that approved migration execution,
# never as a permanent web-service runtime secret.
